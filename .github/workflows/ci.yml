name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typegen (schemat → typy) musi być zacommitowany
        run: |
          pnpm --filter sardigna-atlas-studio typegen
          git diff --exit-code web/sanity.types.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_API_VERSION: "2025-02-19"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # testowy klucz Turnstile (Cloudflare: zawsze przechodzi), tylko na potrzeby testów
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      - run: pnpm test:unit
      - name: Budżet JS (brotli < 120 kB)
        run: pnpm test:budget
      - name: Martwe linki w web/out
        run: pnpm test:links
      - name: Testy układu (Playwright, Chrome z runnera)
        run: pnpm test:e2e
